name: Build macOS installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the .pkg to a GitHub Release on tags

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: "0.1.0"
      HAS_CERTS: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Engine stress test (no JUCE)
        run: |
          c++ -std=c++20 -O2 -o render tools/render.cpp
          ./render stress

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-8.0.13-${{ runner.os }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (universal arm64 + x86_64)
        run: cmake --build build --config Release --parallel 4

      - name: Locate built plugins
        id: find
        run: |
          AU=$(find build -name "Toilet Vocals.component" -path "*Release*" -type d | grep -v Library | head -1)
          VST3=$(find build -name "Toilet Vocals.vst3" -path "*Release*" -type d | grep -v Library | head -1)
          APP=$(find build -name "Toilet Vocals.app" -path "*Release*" -type d | head -1)
          echo "au=$AU"     >> "$GITHUB_OUTPUT"
          echo "vst3=$VST3" >> "$GITHUB_OUTPUT"
          echo "app=$APP"   >> "$GITHUB_OUTPUT"
          echo "AU:   $AU"; echo "VST3: $VST3"; echo "APP:  $APP"
          test -n "$AU" && test -n "$VST3"
          lipo -info "$AU/Contents/MacOS/Toilet Vocals"

      - name: Validate AU (auval)
        run: |
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aufx TlVc Tlta

      - name: Validate VST3 (pluginval)
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process \
            --skip-gui-tests "${{ steps.find.outputs.vst3 }}"

      - name: Import signing certificates (only if secrets are set)
        if: ${{ env.HAS_CERTS == 'true' }}
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > certs.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certs.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain

      - name: Build .pkg
        env:
          AU: ${{ steps.find.outputs.au }}
          VST3: ${{ steps.find.outputs.vst3 }}
          APP: ${{ steps.find.outputs.app }}
          APP_SIGN_ID: ${{ secrets.MACOS_APP_SIGN_ID }}            # "Developer ID Application: Name (TEAMID)"
          INSTALLER_SIGN_ID: ${{ secrets.MACOS_INSTALLER_SIGN_ID }}  # "Developer ID Installer: Name (TEAMID)"
        run: ./packaging/make_pkg.sh "$VERSION"

      - name: Notarize (only if secrets are set)
        if: ${{ env.HAS_NOTARY == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "dist/ToiletVocals-$VERSION.pkg" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/ToiletVocals-$VERSION.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: ToiletVocals-macOS-pkg
          path: dist/*.pkg

      # Every successful build on main (or a v* tag) publishes/updates the
      # Release for the current VERSION, with the .pkg attached.
      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Toilet Vocals ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.pkg
          body: |
            macOS installer for Toilet Vocals: Audio Unit, VST3 and standalone app.
            Universal (Apple Silicon + Intel), macOS 11 or newer.

            **Install:** download `ToiletVocals-${{ env.VERSION }}.pkg` and double-click it.
            This build is not notarized by Apple, so the first time macOS will refuse to open it:
            go to **System Settings → Privacy & Security**, scroll down, click **Open Anyway**, then run the installer.
            Restart your DAW (or rescan plugins) afterwards.
